name: Installer checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck libreswan xl2tpd ppp iptables ufw
      - name: Syntax and ShellCheck
        run: |
          bash -n l2tp.sh tests/integration.sh
          shellcheck -x l2tp.sh tests/integration.sh
      - name: Offline behavior tests
        run: python3 -m unittest discover -s tests -v
      - name: Actual component and firewall checks in isolated network
        run: sudo bash tests/integration.sh

  debian:
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dependencies and validate on Debian
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          sudo modprobe dummy
          docker run --rm --privileged -v "$PWD:/repo:ro" -w /repo "debian:$SUITE" bash -Eeuo pipefail -c '
            source ./l2tp.sh
            source /etc/os-release
            # Exercise preflight in the container with its PID 1 check represented by this directory.
            mkdir -p /run/systemd/system /run/lock
            preflight
            WORK_DIR=$(mktemp -d)
            trap '\''rm -rf -- "$WORK_DIR"'\'' EXIT
            chmod 711 "$WORK_DIR"
            if [[ $CODENAME == trixie ]]; then
              command -v sqv
              probe_mirror http://deb.debian.org/debian
            fi
            apt_options
            create_package_policy
            try_mirror http://deb.debian.org/debian http://deb.debian.org/debian-security
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shellcheck ufw systemd
            bash -n l2tp.sh
            bash -n tests/integration.sh
            shellcheck -x l2tp.sh tests/integration.sh
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
            ensure_xl2tpd_unit
            systemd-analyze --man=no verify xl2tpd.service ipsec.service
            systemctl --root=/ enable ipsec.service xl2tpd.service
            systemctl --root=/ is-enabled ipsec.service
            systemctl --root=/ is-enabled xl2tpd.service
            bash tests/integration.sh
          '
