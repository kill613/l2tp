name: Installer checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck libreswan xl2tpd ppp iptables
      - name: Syntax and ShellCheck
        run: |
          bash -n l2tp.sh tests/integration.sh
          shellcheck -x l2tp.sh tests/integration.sh
      - name: Offline behavior tests
        run: python3 -m unittest discover -s tests -v
      - name: Actual component and firewall checks in isolated network
        run: sudo bash tests/integration.sh
